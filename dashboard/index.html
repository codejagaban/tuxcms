<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before the first paint so the page never flashes the
      // wrong one. "tux_theme" is light, dark, or absent (follow the device).
      (function () {
        var dark = false;
        try {
          var choice = localStorage.getItem('tux_theme');
          dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (error) {}
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 1rem; background: #fff; color: #0a0a0a; }
      [data-theme="dark"] .boot { background: #131313; color: #f3f3f3; }
      [data-theme="dark"] .boot__track { background: #2e2e2e; }
      [data-theme="dark"] .boot__bar { background: #f3f3f3; }
      .boot__mark { font: 700 1.5rem/1 "Uncut Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.06em; }
      .boot__track { width: 7rem; height: 2px; overflow: hidden; border-radius: 2px; background: #ebebeb; }
      .boot__bar { display: block; width: 40%; height: 100%; border-radius: 2px; background: #0a0a0a; animation: boot-slide 1.1s cubic-bezier(.65, 0, .35, 1) infinite; }
      @keyframes boot-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    </style>
    <title>dashboard</title>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><div class="boot__mark">TUX</div><div class="boot__track"><span class="boot__bar"></span></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
